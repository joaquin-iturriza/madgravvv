# @package data
# O3a: the run the frozen upstream model was trained on. ~262 GB of strain, fetched
# from GWOSC on demand and cached under `data_cache/` (gitignored; on CC-IN2P3 that
# must live under /sps, never under the tiny /pbs/home).
source: generated          # generated (Phase 2, on the fly) | cached (the fixed ~11k set)
run: O3a
window_seconds: 4.0        # upstream whitens 4 s and Q-transforms the central 2 s
strain_cache: data_cache/strain
val_tiles: 2048

# Fixed-set shards, only read when source=cached.
train_shards: []
val_shards: []

# Stage-2 only.
signal_fraction: 0.5       # balanced; the upstream fixed set is 10:1 the other way
snr_range: [8.0, 25.0]
approximant: IMRPhenomPv2  # baseline; IMRPhenomXPHM is what the upstream banks use
waveform_backend: lal      # data/waveforms.py::LALWaveformBackend; null blocks stage 2
injection_f_lower: 20.0    # matches the high-pass; also the SNR integral's lower limit
injection_distance_mpc: 1000.0   # cancels under SNR rescaling; sets only the raw scale
# How `snr_range` is interpreted. `network` scales so sqrt(sum_ifo rho_ifo^2) over both
# reference PSDs hits the target, then injects into the one detector the tile belongs
# to; `detector` scales so that detector alone hits it. A tile at rho=8 means a
# noticeably louder source under `detector`, so an efficiency curve is uninterpretable
# without knowing which was used. See data/waveforms.py.
snr_convention: network

reference_psd:
  H1: .reference/MADGRAV/data/o3a_search_prep/reference_psd_H1.npz
  L1: .reference/MADGRAV/data/o3a_search_prep/reference_psd_L1.npz

# Which calibration-line list gets notched. The deployed search calls
# whiten_batch_gwpy_o1(..., "o1") with the string hard-coded, so the O3a search notches
# the O1 lines and the O1 L1 dither lines -- that is what the shipped weights saw, so it
# is the default. "o3a" is an R-series ablation and a likely upstream bug. The lists
# themselves live in data/representation.py, not here: a second copy in yaml is how the
# tile builder ended up notching a truncated list nobody noticed.
line_configuration: o1
