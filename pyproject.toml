[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "madgrav-ml"
version = "0.1.0"
description = "Retrainable ML front end and matched-FAR evaluation harness for the MADGRAV gravitational-wave anomaly search."
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.24",
  "scipy>=1.10",
  "matplotlib>=3.8",
  "hydra-core>=1.3",
  "omegaconf>=2.3",
  "pyyaml>=6.0",
]

[project.optional-dependencies]
# Deliberately NOT a dependency: ml4gw. See CLAUDE.md constraint C5 — its whitening
# changes the coherence statistic and therefore the upstream results.
deep = [
  "torch>=2.2",
  "torch-ema>=0.3",
  "mup>=1.0",
]
gw = [
  # Strain access + time-frequency + waveforms. gwpy pulls lalsuite via its own extras;
  # pin nothing here beyond the floor so the cluster wheel resolution stays free.
  "gwpy>=3.0",
  "gwosc>=0.7",
  "gwdatafind>=1.1",
  "lalsuite>=7.0",
  # Needed by the upstream tree, not by us: improved/improved_pipeline.py (which the
  # demo path imports) and lr_cascade/* (the VT and p_astro scripts we are told to
  # reuse rather than reimplement) both use it.
  "scikit-learn>=1.3",
]
dev = [
  "pytest>=7.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
