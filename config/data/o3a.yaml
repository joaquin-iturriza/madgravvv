# @package data
# O3a: the run the frozen upstream model was trained on. ~262 GB of strain, fetched
# from GWOSC on demand and cached under `data_cache/` (gitignored; on CC-IN2P3 that
# must live under /sps, never under the tiny /pbs/home).
source: generated          # generated (Phase 2, on the fly) | cached (the fixed ~11k set)
run: O3a
window_seconds: 4.0        # upstream whitens 4 s and Q-transforms the central 2 s
strain_cache: data_cache/strain
val_tiles: 2048

# Fixed-set shards, only read when source=cached.
train_shards: []
val_shards: []

# Stage-2 only.
signal_fraction: 0.5       # balanced; the upstream fixed set is 10:1 the other way
snr_range: [8.0, 25.0]
approximant: IMRPhenomPv2  # baseline; IMRPhenomXPHM is what the upstream banks use
waveform_backend: null     # must be set before stage 2 will run — see stage2_margin.py

reference_psd:
  H1: .reference/MADGRAV/data/o3a_search_prep/reference_psd_H1.npz
  L1: .reference/MADGRAV/data/o3a_search_prep/reference_psd_L1.npz

# 20 Hz high-pass plus notches on calibration lines and 60 Hz mains harmonics.
notch_lines:
  H1: [15.1, 15.6, 16.4, 16.7, 17.1, 17.6, 35.9, 36.7, 331.9, 410.3, 1001.3,
       1083.7, 1153.1, 1501.3, 60.0, 120.0, 180.0, 240.0, 300.0, 360.0, 420.0, 480.0]
  L1: [15.1, 15.7, 16.3, 16.9, 30.8, 31.4, 32.0, 32.6, 33.2, 33.8, 434.9, 451.2,
       451.8, 1083.1, 1153.1, 1503.1, 1653.1, 60.0, 120.0, 180.0, 240.0, 300.0,
       360.0, 420.0, 480.0]
